name: SageSMS Release

# Builds the debug variant (dev.octoshrimpy.quik.debug) signed with the same debug keystore
# that was used for the copy installed on the phone, so each release installs as an update.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'metadata/**'
      - 'fdroid/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: sage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # SHA-256 of the signing certificate on the phone; a release signed with anything else could not update it
      EXPECTED_CERT_SHA256: 246a4801607b12f55a6b113d4d009fef4b09aa3b9694fa19d37aaec530aa7c30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SAGE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::error title=Missing secret::SAGE_DEBUG_KEYSTORE_BASE64 is not set. Without it Gradle would generate a new key and the APK could not update the installed app."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build APK
        run: ./gradlew :presentation:assembleDebug -PsageBuildNumber=${{ github.run_number }} --console=plain

      - name: Verify signature and collect metadata
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(presentation/build/outputs/apk/debug/SageSMS-v*-debug.apk)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error title=APK lookup failed::Expected 1 APK, found ${#files[@]} (${files[*]:-none})."
            exit 1
          fi
          apk="${files[0]}"

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          actual=$("$build_tools/apksigner" verify --print-certs "$apk" \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error title=Wrong signing key::APK is signed with $actual, expected $EXPECTED_CERT_SHA256."
            exit 1
          fi

          version_name=$("$build_tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          version_code=$("$build_tools/aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          out="SageSMS-${version_name}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"

          {
            echo "apk=$out"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=sage-build-${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          set -euo pipefail
          prev=$(git tag --list 'sage-build-*' --sort=-v:refname | head -1)
          {
            echo "**Version:** ${{ steps.meta.outputs.version_name }} (code ${{ steps.meta.outputs.version_code }})"
            echo
            echo "### Changes"
            if [[ -n "$prev" ]]; then
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
            else
              git log --no-merges --format='- %s (%h)' -10
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SageSMS ${{ steps.meta.outputs.version_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          fail_on_unmatched_files: true

      - name: Remove signing keystore
        if: always()
        run: rm -f ~/.android/debug.keystore
